name: Build, package, and publish

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Validate and build browser packages
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Pin npm version
        run: npm install --global npm@10.8.2
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Audit npm dependencies for high-severity vulnerabilities
        run: npm audit --audit-level=high
      - name: Generate WXT types
        run: npx wxt prepare
      - name: Type-check
        run: npm run typecheck
      - name: Run unit tests
        run: npm test
      - name: Build Chrome package
        run: |
          npm run build:chrome
          mkdir -p packages
          cd .output/chrome-mv3
          zip -qr ../../packages/chat-automation-chrome.zip .
          cd ../..
          rm -rf site
          mkdir -p site
          cp -R .output/chrome-mv3/. site/
          cat > site/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width, initial-scale=1">
              <meta http-equiv="refresh" content="0; url=./documentation.html">
              <title>Chat Automation Documentation</title>
            </head>
            <body>
              <p><a href="./documentation.html">Open Chat Automation documentation</a></p>
            </body>
          </html>
          HTML
      - name: Install temporary browser test tooling
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Install Chromium for browser integration tests
        run: npx playwright install --with-deps chromium
      - name: Run Chromium extension smoke test
        run: xvfb-run -a env RUN_BROWSER_INTEGRATION=1 npm run test:browser
      - name: Build Firefox package (Manifest V3)
        run: |
          npm run build:firefox
          cd .output/firefox-mv3
          zip -qr ../../packages/chat-automation-firefox.zip .
      - name: Build Microsoft Edge package
        run: |
          npm run build:edge
          cd .output/edge-mv3
          zip -qr ../../packages/chat-automation-edge.zip .
      - name: Upload browser packages
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: chat-automation-browser-packages
          path: packages/*.zip
          if-no-files-found: error
          retention-days: 30
      - name: Upload documentation site
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: chat-automation-documentation-site
          path: site/
          if-no-files-found: error
          retention-days: 7

  deploy-pages:
    name: Deploy documentation to GitHub Pages
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Download documentation site
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: chat-automation-documentation-site
          path: site/
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload documentation site to Pages
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site/
      - name: Deploy documentation to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

  publish-release:
    name: Publish browser extension release
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download browser packages
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: chat-automation-browser-packages
          path: packages/
      - name: Read extension version
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Publish development prerelease for main branch
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: v${{ steps.version.outputs.version }}-dev.${{ github.run_number }}
          name: Chat Automation ${{ steps.version.outputs.version }} dev build ${{ github.run_number }}
          prerelease: true
          generate_release_notes: true
          files: packages/*.zip
      - name: Publish stable release for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          files: packages/*.zip
