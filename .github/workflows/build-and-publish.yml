name: Build, package, and publish

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# All jobs start with read-only permissions. Publishing permissions are granted
# only to the jobs that need them, and never to the build/test job.
permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build browser packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Pin npm version
        run: npm install --global npm@10.8.2

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate WXT types
        run: npx wxt prepare

      - name: Type-check
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Build Chrome package and documentation site
        run: |
          npm run build:chrome
          mkdir -p packages site
          cd .output/chrome-mv3
          zip -qr ../../packages/chat-automation-chrome.zip .
          cd ../..
          cp -R .output/chrome-mv3/. site/
          cat > site/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width, initial-scale=1">
              <meta http-equiv="refresh" content="0; url=./documentation.html">
              <title>Chat Automation Documentation</title>
            </head>
            <body>
              <p><a href="./documentation.html">Open Chat Automation documentation</a></p>
            </body>
          </html>
          HTML

      - name: Build Firefox package (Manifest V3)
        run: |
          npm run build:firefox
          cd .output/firefox-mv3
          zip -qr ../../packages/chat-automation-firefox.zip .

      - name: Build Microsoft Edge package
        run: |
          npm run build:edge
          cd .output/edge-mv3
          zip -qr ../../packages/chat-automation-edge.zip .

      - name: Upload browser packages
        uses: actions/upload-artifact@v4
        with:
          name: chat-automation-browser-packages
          path: packages/*.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload documentation site
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: actions/upload-artifact@v4
        with:
          name: chat-automation-documentation-site
          path: site/
          if-no-files-found: error
          retention-days: 1

  deploy-docs:
    name: Deploy documentation
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download documentation site
        uses: actions/download-artifact@v4
        with:
          name: chat-automation-documentation-site
          path: site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload documentation site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy documentation to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  publish-release:
    name: Publish browser release
    needs: build
    if: (github.event_name == 'push' && ((github.ref == 'refs/heads/main') || (github.ref == 'refs/heads/master') || startsWith(github.ref, 'refs/tags/v')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download browser packages
        uses: actions/download-artifact@v4
        with:
          name: chat-automation-browser-packages
          path: packages

      - name: Read extension version
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish development prerelease for main branch
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}-dev.${{ github.run_number }}
          name: Chat Automation ${{ steps.version.outputs.version }} dev build ${{ github.run_number }}
          prerelease: true
          generate_release_notes: true
          files: packages/*.zip

      - name: Publish stable release for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: packages/*.zip
