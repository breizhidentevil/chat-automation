name: Build, package, and publish

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build browser packages and documentation
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Pin npm version
        run: npm install --global npm@10.8.2

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate WXT types
        run: npx wxt prepare

      - name: Type-check
        run: npm run typecheck

      - name: Build Chrome package
        run: |
          npm run build:chrome
          mkdir -p packages
          cd .output/chrome-mv3
          zip -qr ../../packages/chat-automation-chrome.zip .
          cd ../..
          rm -rf site
          mkdir -p site
          cp -R .output/chrome-mv3/. site/
          cat > site/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width, initial-scale=1">
              <meta http-equiv="refresh" content="0; url=./documentation.html">
              <title>Chat Automation Documentation</title>
            </head>
            <body>
              <p><a href="./documentation.html">Open Chat Automation documentation</a></p>
            </body>
          </html>
          HTML

      - name: Build Firefox package (Manifest V3)
        run: |
          npm run build:firefox
          cd .output/firefox-mv3
          zip -qr ../../packages/chat-automation-firefox.zip .

      - name: Build Microsoft Edge package
        run: |
          npm run build:edge
          cd .output/edge-mv3
          zip -qr ../../packages/chat-automation-edge.zip .

      - name: Upload browser packages
        uses: actions/upload-artifact@v4
        with:
          name: chat-automation-browser-packages
          path: packages/*.zip
          if-no-files-found: error
          retention-days: 30

      - name: Configure GitHub Pages
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: actions/configure-pages@v5

      - name: Upload documentation site
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy documentation to GitHub Pages
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Publish browser ZIPs to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: packages/*.zip
