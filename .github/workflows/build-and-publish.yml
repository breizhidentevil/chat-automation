name: Build, package, and publish

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Validate and build browser packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
      - name: Pin npm version
        run: npm install --global npm@10.8.2
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Generate WXT types
        run: npx wxt prepare
      - name: Type-check
        run: npm run typecheck
      - name: Run unit tests
        run: npm test
      - name: Build Chrome package
        run: |
          npm run build:chrome
          mkdir -p packages
          cd .output/chrome-mv3
          zip -qr ../../packages/chat-automation-chrome.zip .
          cd ../..
          rm -rf site
          mkdir -p site
          cp -R .output/chrome-mv3/. site/
          cat > site/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width, initial-scale=1">
              <meta http-equiv="refresh" content="0; url=./documentation.html">
              <title>Chat Automation Documentation</title>
            </head>
            <body>
              <p><a href="./documentation.html">Open Chat Automation documentation</a></p>
            </body>
          </html>
          HTML
      - name: Build Firefox package (Manifest V3)
        run: |
          npm run build:firefox
          cd .output/firefox-mv3
          zip -qr ../../packages/chat-automation-firefox.zip .
      - name: Build Microsoft Edge package
        run: |
          npm run build:edge
          cd .output/edge-mv3
          zip -qr ../../packages/chat-automation-edge.zip .
      - name: Upload browser packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: chat-automation-browser-packages
          path: packages/*.zip
          if-no-files-found: error
          retention-days: 30
      - name: Upload documentation site
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: chat-automation-documentation-site
          path: site/
          if-no-files-found: error
          retention-days: 7

  deploy-pages:
    name: Deploy documentation to GitHub Pages
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Download documentation site
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: chat-automation-documentation-site
          path: site/
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - name: Upload documentation site to Pages
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site/
      - name: Deploy documentation to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

  publish-release:
    name: Publish browser extension release
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Download browser packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: chat-automation-browser-packages
          path: packages/
      - name: Read extension version
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Publish development prerelease for main branch
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v${{ steps.version.outputs.version }}-dev.${{ github.run_number }}
          name: Chat Automation ${{ steps.version.outputs.version }} dev build ${{ github.run_number }}
          prerelease: true
          generate_release_notes: true
          files: packages/*.zip
      - name: Publish stable release for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          files: packages/*.zip
